  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6260f389-2a43-45d2-9bc3-14217efc50f0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"10e764d9-365e-4f9c-8d0d-0f160e117c28\"><\u002Fscript>\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 200;\n  font-display: swap;\n  src: url(\"0fd2137f-5330-406f-9e36-beb9bc998db9\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 200;\n  font-display: swap;\n  src: url(\"2814f3f4-dc78-4b4a-9f06-68ce1dee1574\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 200;\n  font-display: swap;\n  src: url(\"45798133-81db-4b55-b165-8bd69ea52993\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */ :column;position:relative;overflow:hidden;background:var(--color-bg)\">\n\n  <sc-if value=\"{{ hasUpdate }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;background:color-mix(in srgb, var(--color-accent) 12%, var(--color-bg));border-bottom:1px solid var(--color-accent-800)\">\n      <span style=\"width:6px;height:6px;border-radius:99px;background:var(--color-accent);flex:none;animation:breathe 2.4s ease-in-out infinite\"><\u002Fspan>\n      <span style=\"flex:1;font-size:13px;color:var(--color-accent-200)\">Hay una versión nueva de Seed<\u002Fspan>\n      <button sc-camel-on-click=\"{{ applyUpdate }}\" class=\"btn btn-primary\" style=\"min-height:38px;font-size:13px;white-space:nowrap\">Actualizar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div class=\"scroll\" style=\"flex:1;padding:calc(env(safe-area-inset-top) + 20px) 22px 0\">\n\n    <!-- ═══════════ INICIO ═══════════ -->\n    <sc-if value=\"{{ isInicio }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Inicio\" style=\"animation:fadeIn .22s ease\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n        <span style=\"display:flex;align-items:center;gap:8px;font-size:14.5px;letter-spacing:.01em;color:var(--color-neutral-300)\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex:none\">\n            <path d=\"M6 14.5c0-5.6 3-10.6 6-13.5 3 2.9 6 7.9 6 13.5a6 6 0 0 1-12 0z\" stroke=\"var(--color-accent)\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath>\n            <path d=\"M12 20.5V8.5\" stroke=\"var(--color-accent-300)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n          seed\n        <\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <span class=\"kick\">{{ dateLabel }}<\u002Fspan>\n lex;flex-direction:column;gap:2px\">\n                <span style=\"font-size:16px;font-weight:300;letter-spacing:-.01em\">{{ e.cat }}<\u002Fspan>\n                <span style=\"font-size:11.5px;color:var(--color-neutral-600)\">{{ e.meta }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ e.armed }}\" hint-placeholder-val=\"{{ false }}\">\n                <span sc-camel-on-click=\"{{ e.remove }}\" style=\"font-size:12px;color:var(--color-accent-300);padding:4px 9px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--color-accent-700)\">borrar<\u002Fspan>\n              <\u002Fsc-if>\n              <span class=\"num\" style=\"font-size:16px;font-weight:300;color:var(--color-neutral-200)\">{{ e.amount }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noToday }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:var(--color-neutral-600)\">Nada registrado hoy. El día completo sigue tuyo.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:26px\">\n        <span class=\"kick\">esta semana<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px\">\n          <sc-for list=\"{{ week }}\" as=\"w\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n              <div style=\"height:30px;display:flex;align-items:center;justify-content:center\">\n                <span style=\"{{ w.dotStyle }}\"><\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"{{ w.labelStyle }}\">{{ w.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ goAhorro }}\" style=\"position:relative;margin-top:26px;padding:20px;border-radius:var(--radius-lg);overflow:hidden;curso div style=\"display:flex;align-items:center;gap:14px;padding:12px 20px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--color-neutral-900);background:var(--color-bg)\">\n    <div style=\"flex:1;display:flex\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">\n          <span style=\"{{ t.markStyle }}\"><\u002Fspan>\n          <span>{{ t.name }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ openSheet }}\" style=\"flex:none;width:56px;height:56px;margin-top:-30px;border-radius:99px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--color-bg);box-shadow:0 0 0 1px var(--color-accent-600), 0 0 30px color-mix(in srgb,var(--color-accent) 32%,transparent), 0 10px 26px rgba(0,0,0,.6)\">\n      <span style=\"font-size:31px;font-weight:200;line-height:1;color:var(--color-accent-200);margin-top:-3px\">+<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n\n  <!-- toast -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 100px);display:flex;justify-content:center;pointer-events:none;z-index:90\">\n      <span style=\"animation:toastIn 2s ease forwards;padding:10px 17px;border-radius:99px;font-size:13px;color:var(--color-accent-200);background:color-mix(in srgb,var(--color-accent) 14%,var(--color-bg));box-shadow:0 0 0 1px var(--color-accent-700)\">{{ toast }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ BLOQUEO ═══════════ -->\n  <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:200;background:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px calc(env(safe-area-inset-bottom) + 22px);animation:fadeIn .2s ease\">\n    <svg sc-camel-view-box=\"0 0 48 48\" style=\"width:44px;height:44px;margin-bottom:16px\">\n      <ellipse cx=\"24\" cy=\"31\" rx=\"11\" ry=\"13\" fill=\"var(--color-accent-500)\"><\u002Fellipse>\n      <path d=\"M24 18 C23 12 23 10 24 8\" stroke=\"var(--color-accent-200)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n      <path d=\"M25 13 C31 12 35 9 36 5 C30 5 26 8 25 13Z\" fill=\"var(--color-accent-400)\"><\u002Fpath>\n      <path d=\"M23 15 C18 14 15 12 14 9 C19 9 22 11 23 15Z\" fill=\"var(--color-accent-600)\"><\u002Fpath>\n    <\u002Fsvg>\n    <span style=\"font-size:15px;font-weight:300;color:var(--color-neutral-300)\">{{ lockTitle }}<\u002Fspan>\n\n    <div style=\"display:flex;gap:11px;margin-top:22px;min-height:14px\">\n      <sc-for list=\"{{ pinDots }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <span style=\"{{ p.style }}\"><\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:26px\">\n      <sc-for list=\"{{ lockKeys }}\" as=\"k\" hint-placeholder-count=\"12\">\n        <div sc-camel-on-click=\"{{ k.tap }}\" style=\"{{ k.style }}\">{{ k.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasBio }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ useBio }}\" class=\"btn btn-secondary\" style=\"margin-top:22px;min-height:46px;font-size:13.5px\">Entrar con huella<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ MENÚ ═══════════ -->\n  <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:110;display:flex;flex-direction:column;justify-content:flex-end\">\n    <div sc-camel-on-click=\"{{ closeMenu }}\" style=\"position:absolute;inset:0;background:rgba(8,9,14,.74);animation:fadeIn .2s ease\"><\u002Fdiv>\n    <div style=\"position:relative;animation:sheetUp .34s cubic-bezier(.2,.9,.2,1);background:var(--color-surface);border-radius:20px 20px 0 0;box-shadow:0 -1px 0 var(--color-neutral-700),0 -24px 60px rgba(0,0,0,.65);padding:12px 22px calc(env(safe-area-inset-bottom) + 22px)\">\n      <div style=\"width:38px;height:4px;border-radius:99px;background:var(--color-neutral-800);margin:0 auto 16px\"><\u002Fdiv>\n\n      <span class=\"kick\">poner seed en tu celular<\u002Fspan>\n      <p style=\"margin:10px 0 0;font-size:13.5px;line-height:1.6;color:var(--color-neutral-300);text-wrap:pretty\">En Chrome, abre el menú de los tres puntos (⋮) arriba a la derecha del navegador y elige <span style=\"color:var(--color-accent-300)\">Agregar a pantalla de inicio<\u002Fspan>. Queda como una app.<\u002Fp>\n\n      <div class=\"rule\" style=\"margin:22px 0\"><\u002Fdiv>\n\n      <span class=\"kick\">tu meta de ahorro<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n        <input class=\"input\" value=\"{{ goalName }}\" sc-camel-on-change=\"{{ setGoalName }}\" placeholder=\"Nombre de la meta\" style=\"width:100%;box-sizing:border-box;min-height:46px;font-size:14px\">\n        <input class=\"input\" value=\"{{ goalTargetRaw }}\" sc-camel-on-change=\"{{ setGoalTarget }}\" inputmode=\"numeric\" placeholder=\"Cuánto quieres juntar\" style=\"width:100%;box-sizing:border-box;min-height:46px;font-size:14px\">\n      <\u002Fdiv>\n\n      <div class=\"rule\" style=\"margin:22px 0\"><\u002Fdiv>\n\n      <span class=\"kick\">versión<\u002Fspan>\n      <p style=\"margin:9px 0 0;font-size:12.5px;line-height:1.6;color:var(--color-neutral-500);text-wrap:pretty\">{{ versionNote }}<\u002Fp>\n      <button sc-camel-on-click=\"{{ checkNow }}\" class=\"btn btn-secondary\" style=\"margin-top:11px;min-height:46px;font-size:13px\">Buscar actualización<\u002Fbutton>\n\n      <div class=\"rule\" style=\"margin:22px 0\"><\u002Fdiv>\n\n      <span class=\"kick\">seguridad<\u002Fspan>\n      <p style=\"margin:9px 0 0;font-size:12.5px;line-height:1.6;color:var(--color-neutral-500);text-wrap:pretty\">{{ securityNote }}<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n        <sc-if value=\"{{ noPin }}\" hint-placeholder-val=\"{{ true }}\">\n          <input class=\"input\" value=\"{{ newPin }}\" sc-camel-on-change=\"{{ setNewPin }}\" inputmode=\"numeric\" placeholder=\"Clave de 4 a 6 números\" style=\"width:100%;box-sizing:border-box;min-height:46px;font-size:14px\">\n          <button sc-camel-on-click=\"{{ savePin }}\" class=\"btn btn-primary\" style=\"min-height:46px;font-size:13.5px\">Activar clave<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasPin }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:9px\">\n            <button sc-camel-on-click=\"{{ toggleBio }}\" class=\"btn btn-secondary\" style=\"flex:1;min-height:46px;font-size:13px\">{{ bioLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ removePin }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:46px;font-size:13px\">Quitar clave<\u002Fbutton>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ lockNow }}\" class=\"btn btn-ghost\" style=\"min-height:46px;font-size:13px\">Bloquear ahora<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div class=\"rule\" style=\"margin:22px 0\"><\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ reset }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:46px;font-size:13px\">Empezar de cero<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeMenu }}\" class=\"btn btn-primary\" style=\"flex:1;min-height:46px;font-size:13.5px\">Listo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ HOJA DE REGISTRO ═══════════ -->\n  <sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end\">\n    <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute;inset:0;background:rgba(8,9,14,.74);animation:fadeIn .2s ease\"><\u002Fdiv>\n    <div style=\"position:relative;animation:sheetUp .34s cubic-bezier(.2,.9,.2,1);background:var(--color-surface);border-radius:20px 20px 0 0;box-shadow:0 -1px 0 var(--color-neutral-700),0 -24px 60px rgba(0,0,0,.65);padding:12px 22px calc(env(safe-area-inset-bottom) + 22px)\">\n      <div style=\"width:38px;height:4px;border-radius:99px;background:var(--color-neutral-800);margin:0 auto 14px\"><\u002Fdiv>\n\n      <!-- paso 1: cartas -->\n      <sc-if value=\"{{ stepCat }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n          <span class=\"kick\">en qué<\u002Fspan>\n          <span style=\"font-size:11.5px;color:var(--color-neutral-600);white-space:nowrap\">desliza o toca<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-touch-start=\"{{ deckStart }}\" sc-camel-on-touch-end=\"{{ deckEnd }}\" style=\"position:relative;height:172px;margin-top:14px\">\n          <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ c.choose }}\" style=\"{{ c.style }}\">\n              <span class=\"kick\">{{ c.kicker }}<\u002Fspan>\n              <span style=\"font-size:30px;font-weight:200;letter-spacing:-.03em;margin-top:auto;line-height:1.1\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-size:12px;color:var(--color-neutral-500);margin-top:6px\">{{ c.hint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;justify-content:center;margin-top:16px\">\n          <sc-for list=\"{{ cardDots }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <span sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:16px\">\n          <button sc-camel-on-click=\"{{ deckPrev }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:46px;font-size:13.5px\">Anterior<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ deckNext }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:46px;font-size:13.5px\">Siguiente<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:9px;margin-top:12px\">\n          <input class=\"input\" value=\"{{ newCat }}\" sc-camel-on-change=\"{{ setNewCat }}\" placeholder=\"o crea una categoría nueva\" style=\"flex:1;min-height:46px;font-size:14px\">\n          <button sc-camel-on-click=\"{{ addCat }}\" class=\"btn btn-secondary\" style=\"min-height:46px;font-size:13.5px\">Crear<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- paso 2: monto -->\n      <sc-if value=\"{{ stepAmount }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn .2s ease\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n          <span sc-camel-on-click=\"{{ backToCat }}\" style=\"{{ catChipStyle }}\">{{ cat }} ·  cambiar<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeSheet }}\" style=\"font-size:13px;color:var(--color-neutral-500);cursor:pointer;padding:6px\">cerrar<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:5px;padding:18px 0 2px\">\n          <span style=\"font-size:26px;font-weight:200;color:var(--color-neutral-700)\">$<\u002Fspan>\n          <span class=\"num\" style=\"{{ draftStyle }}\">{{ draftAmount }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <input class=\"input\" value=\"{{ note }}\" sc-camel-on-change=\"{{ setNote }}\" placeholder=\"¿en qué fue? (opcional)\" style=\"width:100%;box-sizing:border-box;min-height:46px;font-size:14px;margin-top:14px\">\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px\">\n          <sc-for list=\"{{ keys }}\" as=\"k\" hint-placeholder-count=\"12\">\n            <div sc-camel-on-click=\"{{ k.tap }}\" style=\"{{ k.style }}\">{{ k.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:14px\">\n          <button sc-camel-on-click=\"{{ saveToJar }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:48px;font-size:13.5px\">Fue ahorro<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ saveExpense }}\" class=\"btn btn-primary\" style=\"flex:1.5;min-height:48px;font-size:13.5px\">Registrar gasto<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst KEY = 'seed.v1';\nconst APP_V = '1.9.3';\nconst TODAY = new Date();\nconst DAY = TODAY.getDate();\nconst YEAR = TODAY.getFullYear();\nconst MON = TODAY.getMonth();\nconst MONTH_DAYS = new Date(YEAR, MON + 1, 0).getDate();\nconst YM = YEAR * 12 + MON;\nfunction dowOf(day) { return DOW[new Date(YEAR, MON, day).getDay()]; }\nconst DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];\nconst MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',\n                'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];\n\nconst CATS = [\n  { name: 'Comida',     kicker: 'lo más usado', hint: 'almuerzo, mercado del día', tint: 'var(--color-accent-400)' },\n  { name: 'Gasolina',   kicker: 'moto',         hint: 'tanqueadas de la semana',   tint: 'var(--color-accent-500)' },\n  { name: 'Transporte', kicker: 'bus · app',    hint: 'cuando no vas en moto',     tint: 'var(--color-accent-600)' },\n  { name: 'Mercado',    kicker: 'casa',         hint: 'compra grande de la semana', tint: 'var(--color-accent-2-500)' },\n  { name: 'Diezmo',     kicker: 'iglesia',      hint: 'aparte de los fijos',        tint: 'var(--color-accent-700)' },\n  { name: 'Otro',       kicker: 'sin categoría', hint: 'todo lo que no encaja',     tint: 'var(--color-neutral-600)' }\n];\n\nconst FIXED_TINTS = ['var(--color-accent-400)', 'var(--color-accent-500)', 'var(--color-accent-600)',\n                     'var(--color-accent-700)', 'var(--color-neutral-600)', 'var(--color-neutral-700)'];\n\nfunction hashPin(p) {\n  let h = 5381; const s = 'seed·' + p;\n  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;\n  return 'h' + h.toString(36);\n}\nconst b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));\nconst unb64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));\n\nfunction normalize(rawData) {\n  const data = Object.assign(seed(), rawData);\n  data.entries = (data.entries || []).filter(e => typeof e.ym === 'number');\n  data.fixed = (data.fixed || []).map(f => ({\n    name: f.name, amount: f.amount, day: f.day,\n    paidYm: typeof f.paidYm === 'number' ? f.paidYm : null\n  }));\n  if (!data.entries.length) data.entries = seed().entries;\n  if (typeof data.monthlyGoal !== 'number') data.monthlyGoal = seed().monthlyGoal;\n  if (!data.monthlySaved || typeof data.monthlySaved !== 'object') data.monthlySaved = {};\n  if (!data.purchase || typeof data.purchase !== 'object') data.purchase = seed().purchase;\n  if (!data.lock || typeof data.lock !== 'object') data.lock = { hash: null, bio: null };\n  data.fixed = data.fixed.filter(x => !(/^comida$/i.test((x.name || '').trim()) && !x.amount));\n  const combo = data.fixed.findIndex(x => /arriendo \\+ comida/i.test(x.name || ''));\n  if (combo !== -1) {\n    const c = data.fixed[combo];\n    data.fixed.splice(combo, 1, { name: 'Arriendo', amount: c.amount, day: c.day, paidYm: c.paidYm });\n  }\n  return data;\n}\n\n// la clave del candado se convierte en llave de cifrado (PBKDF2 · AES-GCM 256)\nasync function deriveKey(pin, salt) {\n  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);\n  return crypto.subtle.deriveKey(\n    { name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' },\n    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);\n}\n\nfunction seed() {\n  return {\n    lock: { hash: null, bio: null, len: 0 },\n    income: 2300000,\n    cats: [],\n    savings: 1240000,\n    monthlyGoal: 300000,\n    monthlySaved: {},\n    purchase: { name: 'Algo que quiero', target: 1500000, saved: 0 },\n    fixed: [\n      { name: 'Arriendo',          amount: 400000, day: 'el 1',  paidYm: YM },\n      { name: 'Crédito moto',      amount: 304000, day: 'el 5',  paidYm: YM },\n      { name: 'Claro',             amount: 270000, day: 'el 12', paidYm: YM },\n      { name: 'Diezmo',            amount: 180000, day: 'los domingos', paidYm: null },\n      { name: 'Gasolina moto',     amount: 120000, day: 'cada semana', paidYm: null }\n    ],\n    goals: [\n      { name: 'Fondo de emergencia', target: 2000000, saved: 1240000 },\n      { name: 'Mantenimiento moto',  target: 600000,  saved: 168000 },\n      { name: 'Diciembre',           target: 1200000, saved: 528000 }\n    ],\n    entries: [\n      { id: 101, cat: 'Comida',     amount: 14000, back: 0,  time: '12:40' },\n      { id: 102, cat: 'Gasolina',   amount: 22000, back: 0,  time: '08:10' },\n      { id: 103, cat: 'Comida',     amount: 13500, back: 1,  time: '13:20' },\n      { id: 104, cat: 'Transporte', amount: 6200,  back: 2,  time: '07:15' },\n      { id: 105, cat: 'Comida',     amount: 18500, back: 2,  time: '19:02' },\n      { id: 106, cat: 'Mercado',    amount: 96000, back: 3,  time: '11:20' },\n      { id: 107, cat: 'Comida',     amount: 12000, back: 4,  time: '13:05' },\n      { id: 108, cat: 'Diezmo',     amount: 45000, back: 5,  time: '10:00' },\n      { id: 109, cat: 'Gasolina',   amount: 20000, back: 6,  time: '17:40' },\n      { id: 110, cat: 'Comida',     amount: 16500, back: 7,  time: '12:55' },\n      { id: 111, cat: 'Otro',       amount: 32000, back: 8,  time: '15:30' },\n      { id: 112, cat: 'Comida',     amount: 13500, back: 9,  time: '12:30' },\n      { id: 113, cat: 'Transporte', amount: 5400,  back: 10, time: '07:20' },\n      { id: 114, cat: 'Mercado',    amount: 74000, back: 11, time: '10:45' },\n      { id: 115, cat: 'Gasolina',   amount: 21000, back: 12, time: '18:00' },\n      { id: 116, cat: 'Comida',     amount: 15000, back: 13, time: '13:15' },\n      { id: 117, cat: 'Otro',       amount: 28000, back: 15, time: '16:10' },\n      { id: 118, cat: 'Comida',     amount: 11500, back: 16, time: '12:20' },\n      { id: 119, cat: 'Comida',     amount: 17000, back: 17, time: '12:45' },\n      { id: 120, cat: 'Transporte', amount: 4800,  back: 17, time: '07:10' }\n    ].map(e => ({ id: e.id, cat: e.cat, amount: e.amount, time: e.time, day: DAY - e.back, ym: YM }))\n     .filter(e => e.day >= 1)\n  };\n}\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'inicio', sheet: false, step: 'cat', card: 0, cat: 'Comida',\n    draft: '', picked: DAY, toast: '', armed: null,\n    editFix: false, editGoals: false, dest: 'mes',\n    locked: false, pin: '', newPin: '', encLocked: false, tries: 0, blocked: 0,\n    note: '', newCat: '', menu: false, data: seed()\n  };\n\n  checkUpdate = (loud) => {\n    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })\n      .then(r => r.ok ? r.json() : null)\n      .then(j => {\n        if (j && j.v && j.v !== APP_V) {\n          this.setState({ newV: j.v });\n          if (loud === true) this.flash('Hay la versión ' + j.v);\n        } else if (loud === true) {\n          this.flash(j && j.v ? 'Ya tienes la última (' + APP_V + ')' : 'No se pudo leer version.json');\n        }\n      })\n      .catch(() => { if (loud === true) this.flash('Sin internet o archivo no encontrado'); });\n  };\n\n  componentWillUnmount() {\n    clearInterval(this._u);\n    document.removeEventListener('visibilitychange', this.onHide);\n  }\n\n  // se vuelve a pedir la clave si dejaste la app más de dos minutos\n  onHide = () => {\n    if (document.visibilityState === 'hidden') { this._away = Date.now(); return; }\n    const d = this.state.data;\n    if (d.lock && d.lock.hash && this._away && Date.now() - this._away > 120000) {\n      this.setState({ locked: true, pin: '' });\n      if (d.lock.bio) setTimeout(() => this.tryBio(true), 300);\n    }\n  };\n\n  tryBio = async (silent) => {\n    const cred = this.state.data.lock && this.state.data.lock.bio;\n    if (!cred || !window.PublicKeyCredential) { if (!silent) this.flash('Este celular no tiene huella disponible'); return; }\n    try {\n      const challenge = crypto.getRandomValues(new Uint8Array(32));\n      await navigator.credentials.get({\n        publicKey: {\n          challenge, timeout: 60000, userVerification: 'required',\n          allowCredentials: [{ id: unb64(cred), type: 'public-key' }]\n        }\n      });\n      this.setState({ locked: false, pin: '' });\n    } catch (e) { if (!silent) this.flash('No se pudo leer la huella'); }\n  };\n\n  registerBio = async () => {\n    if (!window.PublicKeyCredential) return this.flash('Este celular no admite huella');\n    try {\n      const challenge = crypto.getRandomValues(new Uint8Array(32));\n      const id = crypto.getRandomValues(new Uint8Array(16));\n      const c = await navigator.credentials.create({\n        publicKey: {\n          challenge,\n          rp: { name: 'Seed' },\n          user: { id, name: 'seed', displayName: 'Seed' },\n          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],\n          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },\n          timeout: 60000, attestation: 'none'\n        }\n      });\n      const raw = b64(c.rawId);\n      this.update(x => { x.lock.bio = raw; return x; });\n      this.flash('Huella activada');\n    } catch (e) { this.flash('No se pudo activar la huella'); }\n  };\n\n  expectedLen() {\n    const d = this.state.data;\n    return this._len || (d.lock && d.lock.len) || 0;\n  }\n\n  tapPin = (k) => {\n    const s = this.state;\n    if (s.blocked > Date.now()) return;\n    if (k === 'del') return this.setState({ pin: s.pin.slice(0, -1) });\n    const pin = (s.pin + k).slice(0, 6);\n    this.setState({ pin });\n    clearTimeout(this._pt);\n    const expect = this.expectedLen();\n    if (expect) {\n      // sabemos cuántos números tiene la clave: solo se prueba al completarla\n      if (pin.length === expect) this._pt = setTimeout(() => this.tryUnlock(pin, true), 60);\n    } else if (pin.length >= 4) {\n      // clave vieja sin longitud guardada: los prefijos se prueban sin castigar\n      this._pt = setTimeout(() => this.tryUnlock(pin, pin.length === 6), 420);\n    }\n  };\n\n  failPin = () => {\n    const tries = this.state.tries + 1;\n    if (tries >= 5) {\n      this.setState({ tries: 0, pin: '', blocked: Date.now() + 30000 });\n      this.flash('Cinco intentos fallidos · espera 30 segundos');\n      setTimeout(() => this.forceUpdate(), 30500);\n      return;\n    }\n    this.setState({ tries, pin: '' });\n    this.flash('Clave incorrecta');\n  };\n\n  tryUnlock = async (pin, canFail) => {\n    // guardado cifrado: la clave correcta es la que logra descifrar\n    if (this.state.encLocked && this._blob) {\n      try {\n        const salt = unb64(this._blob.salt);\n        const key = await deriveKey(pin, salt);\n        const pt = await crypto.subtle.decrypt(\n          { name: 'AES-GCM', iv: unb64(this._blob.iv) }, key, unb64(this._blob.ct));\n        const data = normalize(JSON.parse(new TextDecoder().decode(pt)));\n        this._key = key; this._salt = this._blob.salt; this._len = pin.length;\n        this.setState({ data, locked: false, encLocked: false, pin: '', tries: 0 });\n      } catch (e) { if (canFail !== false) this.failPin(); }\n      return;\n    }\n    const h = this.state.data.lock && this.state.data.lock.hash;\n    if (hashPin(pin) === h) {\n      this.setState({ locked: false, pin: '', tries: 0 });\n      // instalaciones viejas guardaban en claro: al entrar, se cifran en el sitio\n      this._len = pin.length;\n      if (!this._key) {\n        try {\n          const saltBytes = crypto.getRandomValues(new Uint8Array(16));\n          this._key = await deriveKey(pin, saltBytes);\n          this._salt = b64(saltBytes);\n          this.update(x => { x.lock.len = pin.length; return x; });\n        } catch (e) { this._key = null; }\n      }\n      return;\n    }\n    if (canFail !== false) this.failPin();\n  };\n\n  componentDidMount() {\n    this.checkUpdate();\n    this._u = setInterval(this.checkUpdate, 300000);\n    window.addEventListener('focus', this.checkUpdate);\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) {\n        const parsed = JSON.parse(raw);\n        if (parsed && parsed.enc) {\n          // guardado cifrado: sin la clave no hay nada que mostrar\n          this._blob = parsed;\n          this._len = parsed.len || 0;\n          this.setState({ locked: true, encLocked: true });\n        } else {\n          const data = normalize(parsed);\n          const startLocked = !!(data.lock && data.lock.hash);\n          this.setState({ data, locked: startLocked });\n          if (startLocked && data.lock.bio) setTimeout(() => this.tryBio(true), 350);\n        }\n      }\n    } catch (e) { /* primera vez */ }\n    document.addEventListener('visibilitychange', this.onHide);\n  }\n\n  persist(data) {\n    if (this._key) {\n      const json = JSON.stringify(data);\n      // se encadenan las escrituras para que no se pisen entre sí\n      this._q = (this._q || Promise.resolve()).then(async () => {\n        const iv = crypto.getRandomValues(new Uint8Array(12));\n        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this._key, new TextEncoder().encode(json));\n        try {\n          localStorage.setItem(KEY, JSON.stringify({ enc: 1, salt: this._salt, iv: b64(iv), ct: b64(ct), len: this._len || 0 }));\n        } catch (e) { /* modo privado */ }\n      }).catch(() => {});\n      return;\n    }\n    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* modo privado */ }\n  }\n\n  update(fn) {\n    this.setState(s => {\n      const data = fn(JSON.parse(JSON.stringify(s.data)));\n      this.persist(data);\n      return { data };\n    });\n  }\n\n  money(n) { return '$' + Math.round(n).toLocaleString('es-CO'); }\n  compact(n) { return '$' + Math.round(n / 1000).toLocaleString('es-CO') + 'k'; }\n\n  flash(t) {\n    this.setState({ toast: t });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2000);\n  }\n\n  tapKey(k) {\n    const d = this.state.draft;\n    if (k === 'del') return this.setState({ draft: d.slice(0, -1) });\n    if (d.length >= 9) return;\n    if (d === '' && k === '000') return;\n    this.setState({ draft: d + k });\n  }\n\n  saveExpense = () => {\n    const v = parseInt(this.state.draft || '0', 10);\n    if (!v) return this.flash('Escribe un monto');\n    const cat = this.state.cat;\n    const note = this.state.note.trim();\n    const time = new Date().toTimeString().slice(0, 5);\n    this.update(d => {\n      d.entries = [{ id: Date.now(), cat, note, amount: v, day: DAY, ym: YM, time }].concat(d.entries);\n      return d;\n    });\n    this.setState({ draft: '', note: '', sheet: false, step: 'cat', tab: 'inicio' });\n    this.flash(this.money(v) + ' en ' + cat.toLowerCase());\n  };\n\n  addSave(v) {\n    const to = this.state.dest;\n    this.update(x => {\n      x.savings += v;\n      if (to === 'compra') { x.purchase.saved += v; }\n      else {\n        x.monthlySaved[YM] = (x.monthlySaved[YM] || 0) + v;\n        if (x.goals[0]) x.goals[0].saved += v;\n      }\n      return x;\n    });\n    this.flash('Al frasco: ' + this.money(v) + (to === 'compra' ? ' · compra' : ' · mes'));\n  }\n\n  saveToJar = () => {\n    const v = parseInt(this.state.draft || '0', 10);\n    if (!v) return this.flash('Escribe un monto');\n    this.addSave(v);\n    this.setState({ draft: '', sheet: false, step: 'cat', tab: 'ahorro' });\n  };\n\n  deckStart = (e) => { this._x = e.touches[0].clientX; };\n  deckEnd = (e) => {\n    if (this._x == null) return;\n    const dx = e.changedTouches[0].clientX - this._x;\n    this._x = null;\n    if (Math.abs(dx) < 34) return;\n    this.setState(s => ({ card: (s.card + (dx < 0 ? 1 : CATS.length - 1)) % CATS.length }));\n  };\n\n  renderVals() {\n    const s = this.state;\n    const d = s.data;\n\n    const fixedTotal = d.fixed.reduce((a, f) => a + f.amount, 0);\n    const freeMonth = Math.max(0, d.income - fixedTotal);\n    const mine = (d.entries || []).filter(e => e.ym === YM);\n    const spentMonth = mine.reduce((a, e) => a + e.amount, 0);\n    const todaySpent = mine.filter(e => e.day === DAY).reduce((a, e) => a + e.amount, 0);\n    const remaining = freeMonth - spentMonth;\n    const daysLeft = MONTH_DAYS - DAY + 1;\n    const perDay = freeMonth / MONTH_DAYS;\n    const freeToday = Math.max(0, Math.round(remaining / daysLeft));\n\n    const byDay = new Array(MONTH_DAYS).fill(0);\n    mine.forEach(e => { if (e.day >= 1 && e.day <= MONTH_DAYS) byDay[e.day - 1] += e.amount; });\n    const maxDay = Math.max.apply(null, byDay.concat([1]));\n\n    // racha\n    let streak = 0;\n    for (let day = DAY; day >= 1; day--) { if (byDay[day - 1] > 0) streak++; else break; }\n\n    const savedTotal = d.savings;\n    const goalTarget = d.goals[0] ? d.goals[0].target : 2000000;\n    const saveFrac = Math.min(1, savedTotal / goalTarget);\n\n    const fixed = d.fixed.map((f0, i) => {\n      const f = { name: f0.name, amount: f0.amount, day: f0.day, paid: f0.paidYm === YM };\n      const tint = FIXED_TINTS[i % FIXED_TINTS.length];\n      // ¿el recordatorio trae un día del mes? entonces avisamos según se acerque\n      const dm = /(\\d{1,2})/.exec(Str bel,\n      legend: [\n        { name: 'fijos', amount: this.money(fixedTotal), dotStyle: { width: '7px', height: '7px', borderRadius: '99px', background: 'var(--color-accent-700)', display: 'inline-block' } },\n        { name: 'gastado', amount: this.money(spentMonth), dotStyle: { width: '7px', height: '7px', borderRadius: '99px', background: 'var(--color-accent-400)', display: 'inline-block' } },\n        { name: 'ahorro', amount: this.money(savedTotal), dotStyle: { width: '7px', height: '7px', borderRadius: '99px', background: 'var(--color-accent)', display: 'inline-block' } }\n      ],\n\n      savingsText: this.money(savedTotal),\n      goalName: d.goals[0] ? d.goals[0].name : 'tu meta',\n      goalLine: Math.round(saveFrac * 100) + '% de ' + this.money(goalTarget),\n      jarFillStyle: {\n        position: 'absolute', left: 0, right: 0, bottom: 0, height: (saveFrac * 100) + '%',\n        background: 'linear-gradient(180deg, color-mix(in srgb, var(--color-accent) 44%, transparent), color-mix(in srgb, var(--color-accent) 14%, transparent))',\n        transition: 'height .7s cubic-bezier(.2,.9,.2,1)'\n      },\n      jarLineStyle: {\n        position: 'absolute', left: 0, right: 0, bottom: (saveFrac * 100) + '%', height: '2px',\n        background: 'var(--color-accent-300)',\n        boxShadow: '0 0 18px color-mix(in srgb, var(--color-accent) 75%, transparent)',\n        transition: 'bottom .7s cubic-bezier(.2,.9,.2,1)'\n      },\n      jarMarks: [25, 50, 75].map(p => ({\n        style: { position: 'absolute', right: 0, bottom: p + '%', width: '10px', height: '1px', background: 'var(--color-neutral-800)' }\n      })),\n      jarBandStyle: {\n        position: 'absolute', left: 0, top: 0, bottom: 0, width: (saveFrac * 100) + '%',\n        background: 'linear-gradient(90deg, color-mix(in srgb, var(--color-accent) 26%, transparent), color-mix(in srgb, var(--color-accent) 8%, transparent))',\n        borderRight: '1px solid var(--color-accent-400)',\n        transition: 'width .6s cubic-bezier(.2,.9,.2,1)'\n      },\n      ruleText: 'Lo que no gastaste hoy del cupo diario puede irse al frasco. Hoy serían ' + this.money(sweep) + '.',\n      sweepLabel: sweep > 0 ? 'Guardar ' + this.money(sweep) : 'Nada por barrer hoy',\n      sweepToday: () => {\n        if (sweep <= 0) return this.flash('Hoy no sobró nada');\n        this.addSave(sweep);\n      },\n\n      incomeText: this.money(d.income),\n      incomeNote: 'Si tu ingreso cambia mes a mes, ajústalo aquí y todo lo demás se recalcula.',\n      incomeUp: () => this.update(x => { x.income += 50000; return x; }),\n      incomeDown: () => this.update(x => { x.income = Math.max(0, x.income - 50000); return x; }),\n      fixedTotalText: this.money(fixedTotal) + ' / mes',\n      freeMonthText: this.money(freeMonth),\n      perDayText: this.money(Math.round(perDay)) + ' por día si lo repartes parejo',\n      reset: () => {\n        this.persist(seed());\n        this.setState({ data: seed(), tab: 'inicio', armed: null });\n        this.flash('Datos de ejemplo restaurados');\n      },\n\n      cat: s.cat,\n      catChipStyle: {\n        padding: '8px 14px', borderRadius: '99px', fontSize: '13px', cursor: 'pointer',\n        color: 'var(--color-accent-200)',\n        background: 'color-mix(in srgb, var(--color-accent) 16%, transparent)',\n        boxShadow: 'inset 0 0 0 1px var(--color-accent-600)'\n      },\n      draftAmount: s.draft === '' ? '0' : parseInt(s.draft, 10).toLocaleString('es-CO'),\n      draftStyle: {\n        fontSize: '44px', fontWeight: 200, letterSpacing: '-.03em', lineHeight: 1,\n        color: s.draft === '' ? 'var(--color-neutral-700)' : 'var(--color-text)'\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
