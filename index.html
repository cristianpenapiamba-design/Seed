  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — o, Diezmo…) usa <span style=\"color:var(--color-accent-300)\">Editar<\u002Fspan> aquí arriba.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ editingFixed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:15px\">\n          <sc-for list=\"{{ fixedEdit }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--color-neutral-900)\">\n              <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:6px\">\n                <input class=\"input\" value=\"{{ f.name }}\" sc-camel-on-change=\"{{ f.setName }}\" placeholder=\"Nombre del compromiso\" style=\"width:100%;box-sizing:border-box;min-height:42px;font-size:14px\">\n                <div style=\"display:flex;gap:6px\">\n                  <div style=\"flex:1.3;min-width:0;display:flex;flex-direction:column;gap:4px\">\n                    <span class=\"kick\">cuánto pagas<\u002Fspan>\n                    <input class=\"input\" value=\"{{ f.amountRaw }}\" sc-camel-on-change=\"{{ f.setAmount }}\" inputmode=\"numeric\" placeholder=\"0\" style=\"width:100%;box-sizing:border-box;min-height:42px;font-size:14px\">\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\">\n                    <span class=\"kick\">cuándo lo pagas<\u002Fspan>\n                    <input class=\"input\" value=\"{{ f.day }}\" sc-camel-on-change=\"{{ f.setDay }}\" placeholder=\"ej. el 5\" style=\"width:100%;box-sizing:border-box;min-height:42px;font-size:13px\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span sc-camel-on-click=\"{{ f.remove }}\" style=\"flex:none;width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:300;color:var(--color-neutral-400);cursor:pointer;box-shadow:inset 0 0 0 1px var(--color-neutral-800)\">×<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ addFixed }}\" class=\"btn btn-secondary\" style=\"min-height:44px;font-size:13px\">Agregar compromiso<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:13px 0 0;font-size:11.5px;line-height:1.6;color:var(--color-neutral-600);text-wrap:pretty\">\"Cuándo lo pagas\" es solo un recordatorio para ti: puedes escribir \"el 5\", \"cada domingo\" o dejarlo vacío. Si escribes un número, la app te avisa con color cuando se acerque el día. Se guarda solo.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:26px;padding:18px;border-radius:var(--radius-lg);background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-neutral-800)\">\n        <span class=\"kick\">lo que queda libre<\u002Fspan>\n        <div class=\"num\" style=\"font-size:32px;font-weight:200;letter-spacing:-.04em;margin-top:8px;line-height:1\">{{ freeMonthText }}<\u002Fdiv>\n        <span style=\"font-size:12.5px;color:var(--color-neutral-500)\">{{ perDayText }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px\">\n        <button sc-camel-on-click=\"{{ reset }}\" class=\"btn btn-ghost\" style=\"font-size:12.5px;min-height:44px\">Empezar de cero<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"height:44px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- ═══════════ NAVEGACIÓN ═══════════ -->\n  <div style=\"display:flex;align-items:center;gap:14px;padding:12px 20px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--color-neutral-900);background:var(--color-bg)\">\n    <div style=\"flex:1;display:flex\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">\n          <span style=\"{{ t.markStyle }}\"><\u002Fspan>\n          <span>{{ t.name }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ openSheet }}\" style=\"flex:none;width:56px;height:56px;margin-top:-30px;border-radius:99px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--color-bg);box-shadow:0 0 0 1px var(--color-accent-600), 0 0 30px color-mix(in srgb,var(--color-accent) 32%,transparent), 0 10px 26px rgba(0,0,0,.6)\">\n      <span style=\"font-size:31px;font-weight:200;line-height:1;color:var(--color-accent-200);margin-top:-3px\">+<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n\n  <!-- toast -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 100px);display:flex;justify-content:center;pointer-events:none;z-index:90\">\n      <span style=\"animation:toastIn 2s ease forwards;padding:10px 17px;border-radius:99px;font-size:13px;color:var(--color-accent-200);background:color-mix(in srgb,var(--color-accent) 14%,var(--color-bg));box-shadow:0 0 0 1px var(--color-accent-700)\">{{ toast }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ MENÚ ═══════════ -->\n  <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:110;display:flex;flex-direction:column;justify-content:flex-end\">\n    <div sc-camel-on-click=\"{{ closeMenu }}\" style=\"position:absolute;inset:0;background:rgba(8,9,14,.74);animation:fadeIn .2s ease\"><\u002Fdiv>\n    <div style=\"position:relative;animation:sheetUp .34s cubic-bezier(.2,.9,.2,1);background:var(--color-surface);border-radius:20px 20px 0 0;box-shadow:0 -1px 0 var(--color-neutral-700),0 -24px 60px rgba(0,0,0,.65);padding:12px 22px calc(env(safe-area-inset-bottom) + 22px)\">\n      <div style=\"width:38px;height:4px;border-radius:99px;background:var(--color-neutral-800);margin:0 auto 16px\"><\u002Fdiv>\n\n      <span class=\"kick\">poner seed en tu celular<\u002Fspan>\n      <p style=\"margin:10px 0 0;font-size:13.5px;line-height:1.6;color:var(--color-neutral-300);text-wrap:pretty\">En Chrome, abre el menú de los tres puntos (⋮) arriba a la derecha del navegador y elige <span style=\"color:var(--color-accent-300)\">Agregar a pantalla de inicio<\u002Fspan>. Queda como una app y funciona sin internet.<\u002Fp>\n      <p style=\"margin:10px 0 0;font-size:12.5px;line-height:1.6;color:var(--color-neutral-600);text-wrap:pretty\">En iPhone es el botón de compartir y luego <span style=\"color:var(--color-neutral-300)\">Añadir a pantalla de inicio<\u002Fspan>.<\u002Fp>\n\n      <div class=\"rule\" style=\"margin:22px 0\"><\u002Fdiv>\n\n      <span class=\"kick\">tu meta de ahorro<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n        <input class=\"input\" value=\"{{ goalName }}\" sc-camel-on-change=\"{{ setGoalName }}\" placeholder=\"Nombre de la meta\" style=\"width:100%;box-sizing:border-box;min-height:46px;font-size:14px\">\n        <input class=\"input\" value=\"{{ goalTargetRaw }}\" sc-camel-on-change=\"{{ setGoalTarget }}\" inputmode=\"numeric\" placeholder=\"Cuánto quieres juntar\" style=\"width:100%;box-sizing:border-box;min-height:46px;font-size:14px\">\n      <\u002Fdiv>\n\n      <div class=\"rule\" style=\"margin:22px 0\"><\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ reset }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:46px;font-size:13px\">Empezar de cero<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeMenu }}\" class=\"btn btn-primary\" style=\"flex:1;min-height:46px;font-size:13.5px\">Listo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ HOJA DE REGISTRO ═══════════ -->\n  <sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end\">\n    <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute;inset:0;background:rgba(8,9,14,.74);animation:fadeIn .2s ease\"><\u002Fdiv>\n    <div style=\"position:relative;animation:sheetUp .34s cubic-bezier(.2,.9,.2,1);background:var(--color-surface);border-radius:20px 20px 0 0;box-shadow:0 -1px 0 var(--color-neutral-700),0 -24px 60px rgba(0,0,0,.65);padding:12px 22px calc(env(safe-area-inset-bottom) + 22px)\">\n      <div style=\"width:38px;height:4px;border-radius:99px;background:var(--color-neutral-800);margin:0 auto 14px\"><\u002Fdiv>\n\n      <!-- paso 1: cartas -->\n      <sc-if value=\"{{ stepCat }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n          <span class=\"kick\">en qué<\u002Fspan>\n          <span style=\"font-size:11.5px;color:var(--color-neutral-600);white-space:nowrap\">desliza o toca<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-touch-start=\"{{ deckStart }}\" sc-camel-on-touch-end=\"{{ deckEnd }}\" style=\"position:relative;height:172px;margin-top:14px\">\n          <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ c.choose }}\" style=\"{{ c.style }}\">\n              <span class=\"kick\">{{ c.kicker }}<\u002Fspan>\n              <span style=\"font-size:30px;font-weight:200;letter-spacing:-.03em;margin-top:auto;line-height:1.1\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-size:12px;color:var(--color-neutral-500);margin-top:6px\">{{ c.hint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;justify-content:center;margin-top:16px\">\n          <sc-for list=\"{{ cardDots }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <span sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:16px\">\n          <button sc-camel-on-click=\"{{ deckPrev }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:46px;font-size:13.5px\">Anterior<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ deckNext }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:46px;font-size:13.5px\">Siguiente<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:9px;margin-top:12px\">\n          <input class=\"input\" value=\"{{ newCat }}\" sc-camel-on-change=\"{{ setNewCat }}\" placeholder=\"o crea una categoría nueva\" style=\"flex:1;min-height:46px;font-size:14px\">\n          <button sc-camel-on-click=\"{{ addCat }}\" class=\"btn btn-secondary\" style=\"min-height:46px;font-size:13.5px\">Crear<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- paso 2: monto -->\n      <sc-if value=\"{{ stepAmount }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn .2s ease\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n          <span sc-camel-on-click=\"{{ backToCat }}\" style=\"{{ catChipStyle }}\">{{ cat }} ·  cambiar<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeSheet }}\" style=\"font-size:13px;color:var(--color-neutral-500);cursor:pointer;padding:6px\">cerrar<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:5px;padding:18px 0 2px\">\n          <span style=\"font-size:26px;font-weight:200;color:var(--color-neutral-700)\">$<\u002Fspan>\n          <span class=\"num\" style=\"{{ draftStyle }}\">{{ draftAmount }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <input class=\"input\" value=\"{{ note }}\" sc-camel-on-change=\"{{ setNote }}\" placeholder=\"¿en qué fue? (opcional)\" style=\"width:100%;box-sizing:border-box;min-height:46px;font-size:14px;margin-top:14px\">\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px\">\n          <sc-for list=\"{{ keys }}\" as=\"k\" hint-placeholder-count=\"12\">\n            <div sc-camel-on-click=\"{{ k.tap }}\" style=\"{{ k.style }}\">{{ k.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:14px\">\n          <button sc-camel-on-click=\"{{ saveToJar }}\" class=\"btn btn-ghost\" style=\"flex:1;min-height:48px;font-size:13.5px\">Fue ahorro<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ saveExpense }}\" class=\"btn btn-primary\" style=\"flex:1.5;min-height:48px;font-size:13.5px\">Registrar gasto<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst KEY = 'seed.v1';\nconst APP_V = '1.7.0';\nconst TODAY = new Date();\nconst DAY = TODAY.getDate();\nconst YEAR = TODAY.getFullYear();\nconst MON = TODAY.getMonth();\nconst MONTH_DAYS = new Date(YEAR, MON + 1, 0).getDate();\nconst YM = YEAR * 12 + MON;\nfunction dowOf(day) { return DOW[new Date(YEAR, MON, day).getDay()]; }\nconst DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];\nconst MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',\n                'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];\n\nconst CATS = [\n  { name: 'Comida',     kicker: 'lo más usado', hint: 'almuerzo, mercado del día', tint: 'var(--color-accent-400)' },\n  { name: 'Gasolina',   kicker: 'moto',         hint: 'tanqueadas de la semana',   tint: 'var(--color-accent-500)' },\n  { name: 'Transporte', kicker: 'bus · app',    hint: 'cuando no vas en moto',     tint: 'var(--color-accent-600)' },\n  { name: 'Mercado',    kicker: 'casa',         hint: 'compra grande de la semana', tint: 'var(--color-accent-2-500)' },\n  { name: 'Diezmo',     kicker: 'iglesia',      hint: 'aparte de los fijos',        tint: 'var(--color-accent-700)' },\n  { name: 'Otro',       kicker: 'sin categoría', hint: 'todo lo que no encaja',     tint: 'var(--color-neutral-600)' }\n];\n\nconst FIXED_TINTS = ['var(--color-accent-400)', 'var(--color-accent-500)', 'var(--color-accent-600)',\n                     'var(--color-accent-700)', 'var(--color-neutral-600)', 'var(--color-neutral-700)'];\n\nfunction seed() {\n  return {\n    income: 2300000,\n    cats: [],\n    savings: 1240000,\n    monthlyGoal: 300000,\n    monthlySaved: {},\n    purchase: { name: 'Algo que quiero', target: 1500000, saved: 0 },\n    fixed: [\n      { name: 'Arriendo',          amount: 400000, day: 'el 1',  paidYm: YM },\n      { name: 'Crédito moto',      amount: 304000, day: 'el 5',  paidYm: YM },\n      { name: 'Claro',             amount: 270000, day: 'el 12', paidYm: YM },\n      { name: 'Diezmo',            amount: 180000, day: 'los domingos', paidYm: null },\n      { name: 'Gasolina moto',     amount: 120000, day: 'cada semana', paidYm: null }\n    ],\n    goals: [\n      { name: 'Fondo de emergencia', target: 2000000, saved: 1240000 },\n      { name: 'Mantenimiento moto',  target: 600000,  saved: 168000 },\n      { name: 'Diciembre',           target: 1200000, saved: 528000 }\n    ],\n    entries: [\n      { id: 101, cat: 'Comida',     amount: 14000, back: 0,  time: '12:40' },\n      { id: 102, cat: 'Gasolina',   amount: 22000, back: 0,  time: '08:10' },\n      { id: 103, cat: 'Comida',     amount: 13500, back: 1,  time: '13:20' },\n      { id: 104, cat: 'Transporte', amount: 6200,  back: 2,  time: '07:15' },\n      { id: 105, cat: 'Comida',     amount: 18500, back: 2,  time: '19:02' },\n      { id: 106, cat: 'Mercado',    amount: 96000, back: 3,  time: '11:20' },\n      { id: 107, cat: 'Comida',     amount: 12000, back: 4,  time: '13:05' },\n      { id: 108, cat: 'Diezmo',     amount: 45000, back: 5,  time: '10:00' },\n      { id: 109, cat: 'Gasolina',   amount: // los registros viejos no traían mes: se descartan para no mezclar meses\n        data.entries = (data.entries || []).filter(e => typeof e.ym === 'number');\n        data.fixed = (data.fixed || []).map(f => ({\n          name: f.name, amount: f.amount, day: f.day,\n          paidYm: typeof f.paidYm === 'number' ? f.paidYm : null\n        }));\n        if (!data.entries.length) data.entries = seed().entries;\n        if (typeof data.monthlyGoal !== 'number') data.monthlyGoal = seed().monthlyGoal;\n        if (!data.monthlySaved || typeof data.monthlySaved !== 'object') data.monthlySaved = {};\n        if (!data.purchase || typeof data.purchase !== 'object') data.purchase = seed().purchase;\n        // separar el compromiso combinado en dos, para poder poner cada monto aparte\n        data.fixed = data.fixed.filter(x => !(/^comida$/i.test((x.name || '').trim()) && !x.amount));\n        const combo = data.fixed.findIndex(x => /arriendo \\+ comida/i.test(x.name || ''));\n        if (combo !== -1) {\n          const c = data.fixed[combo];\n          data.fixed.splice(combo, 1, { name: 'Arriendo', amount: c.amount, day: c.day, paidYm: c.paidYm });\n        }\n        this.setState({ data });\n      }\n    } catch (e) { /* primera vez */ }\n  }\n\n  persist(data) {\n    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* modo privado */ }\n  }\n\n  update(fn) {\n    this.setState(s => {\n      const data = fn(JSON.parse(JSON.stringify(s.data)));\n      this.persist(data);\n      return { data };\n    });\n  }\n\n  money(n) { return '$' + Math.round(n).toLocaleString('es-CO'); }\n  compact(n) { return '$' + Math.round(n / 1000).toLocaleString('es-CO') + 'k'; }\n\n  flash(t) {\n    this.setState({ toast: t });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2000);\n  }\n\n  tapKey(k) {\n    const d = this.state.draft;\n    if (k === 'del') return this.setState({ draft: d.slice(0, -1) });\n    if (d.length >= 9) r
